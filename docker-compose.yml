# Optional: run on a machine with Docker (e.g. Jenkins EC2). Not required on your laptop.
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      FRONTEND_URL: http://localhost
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
